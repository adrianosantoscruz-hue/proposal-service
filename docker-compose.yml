version: "3.9"

services:
  proposal-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asspontec-proposal-service
    restart: unless-stopped

    ports:
      - "8000:8000"     # Mude a porta externa se necessário: "9000:8000"

    # Carrega variáveis de ambiente do arquivo .env
    env_file:
      - .env

    # Volume para logs persistentes (opcional)
    volumes:
      - ./logs:/service/logs

    # Limites de recursos (ajuste conforme seu VPS)
    deploy:
      resources:
        limits:
          memory: 1G      # LibreOffice usa ~300MB; 1G é confortável
          cpus: "1.0"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

# ─────────────────────────────────────────────────────────────────────────────
# Para subir: docker compose up -d --build
# Para logs:  docker compose logs -f proposal-service
# Para parar: docker compose down
# ─────────────────────────────────────────────────────────────────────────────
